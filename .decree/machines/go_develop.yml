# yaml-language-server: $schema=../schema/v1/machine.schema.json
# Graph: ../graph/go_develop.md
name: go_develop
description: Implement a message in a Go project with Claude in small, logged steps, run the gate (gofmt, go vet, go test), and have Claude fix failures only if the gate fails.
initial: precheck
states:
  precheck:                        # fails fast if claude, go or decree is not on PATH
    invoke: precheck
    transitions: { done: implement }
  implement:                       # logs each step in progress.md; writes STOP instead of guessing
    invoke:
      script: { name: implement, max_attempts: 3 }
    transitions: { done: gate, stop: failed }
  gate:                            # gofmt, go vet and go test, kept in gate.log
    invoke: gate
    transitions: { done: done, error: qa }
  qa:                              # Claude fixes what gate.log reports
    invoke:
      script: { name: qa, max_attempts: 3 }
    transitions: { done: final_gate, stop: failed }
  final_gate:                      # the gate again; if it fails, so does the run
    invoke: gate
    transitions: { done: done }
  done:   { final: true }
  failed: { final: true }
